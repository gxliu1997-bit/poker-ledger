  <title>牌局账本</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#20312c;background:#f4f6f1;font-synthesis:none}

    .hero-inner{max-width:708px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.13em;color:#b4d3bf;font-weight:800}.hero h1{font-size:29px;margin:7px 0 7px;letter-spacing:.02em}.hero p{margin:0;color:#d5e9db;font-size:14px;line-height:1.6}.offline-state{display:inline-block;margin-top:11px;color:#f5d386;font-size:13px;font-weight:700}

    select,input{border:1px solid #cfdad1;border-radius:11px;background:#fff;color:#20312c;padding:12px;outline:none;min-height:46px}select:focus,input:focus{border-color:#227f58;box-shadow:0 0 0 3px #227f5822}
    .btn{border:0;border-radius:11px;min-height:43px;padding:9px 15px;font-weight:800;background:#e9f2e9;color:#205a40}.btn.primary{background:#16724b;color:white}.btn.outline{background:white;border:1px solid #c8d9ce}.btn.warn{background:#fff3e2;color:#8d5414}
    .modebar{border-top:1px solid #e8eee8;margin-top:15px;padding-top:15px}.segment{display:flex;gap:5px;background:#edf3ed;padding:4px;border-radius:12px;width:max-content;max-width:100%}.segment button{border:0;background:transparent;border-radius:9px;padding:8px 14px;color:#5b7563;font-weight:800}.segment button.selected{background:white;color:#176b48;box-shadow:0 1px 6px #203a281c}.unitline{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:#5b6e60}.unitline input{width:100px;min-height:39px;padding:7px 10px}.modebar .hint{margin-top:8px}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#f4f8f4;border-radius:14px;padding:12px;min-height:78px}.stat:first-child{grid-column:1/-1}.stat span{font-size:13px;color:#64786a;display:block;margin-bottom:8px}.stat strong{font-size:21px;white-space:nowrap;font-variant-numeric:tabular-nums}.stat strong.green,.profit.pos{color:#118052}.stat strong.red,.profit.neg{color:#c44f43}
    .overviewhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.overviewhead h2{font-size:17px;margin:0}.game-meta{font-size:12px;color:#78887c;margin:0 0 13px}.overviewfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}.overviewfoot .hint{margin:0;flex:1;min-width:180px}.results{border-top:1px solid #e7eee7;margin-top:15px;padding-top:11px}.results h3{font-size:14px;margin:0 0 4px}.result-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}.result-row strong{font-variant-numeric:tabular-nums}
    .hint{font-size:13px;line-height:1.5;color:#6d7b70;margin:10px 1px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:19px 3px 10px}.sectionhead h2{font-size:17px;margin:0}.count{color:#75877b;font-size:13px}

    .tiny{font-size:12px;color:#728176;margin:0 0 10px}.log{border-top:1px solid #e8eee8;margin-top:14px;padding-top:8px}.log-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 1px;font-size:13px;border-bottom:1px solid #f0f3ee}.log-row small{color:#8a988d}.log-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
    .empty{text-align:center;color:#718076;padding:35px 10px;font-size:14px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools .btn{font-size:13px}.notice{background:#fff9e9;border:1px solid #f4e2ad;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#795b26;margin-bottom:14px}
    dialog{border:0;border-radius:18px;padding:0;width:min(92vw,390px);box-shadow:0 22px 80px #13271a55}dialog::backdrop{background:#0e2419a8}.dialog-body{padding:21px}.dialog-body h3{margin:0 0 8px;font-size:19px}.dialog-body p{margin:0 0 15px;color:#6a7b70;font-size:13px}.dialog-body input{width:100%;font-size:20px;font-variant-numeric:tabular-nums}.dialog-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
    .settle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eef2ed}.settle-row label{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}.settle-row small{display:block;color:#809086;font-size:11px;font-weight:400;margin-top:3px}.settle-row input{width:126px;font-size:17px}.settle-preview{padding:12px;background:#f2f7f1;border-radius:11px;margin-top:13px;font-size:13px;line-height:1.6}.settle-preview strong{font-size:17px}
    .jump{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}.history-search{width:100%;margin-bottom:13px}.history-card{padding:0;overflow:hidden}.history-card>summary{list-style:none;cursor:pointer;padding:17px}.history-card>summary::-webkit-details-marker,.history-player>summary::-webkit-details-marker{display:none}.history-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.history-top strong{font-size:16px}.history-line{font-size:12px;color:#708174;margin-top:7px}.history-body{border-top:1px solid #e8eee8;padding:15px 17px 17px}.history-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.history-metrics div{background:#f5f8f3;border-radius:11px;padding:10px}.history-metrics span{display:block;color:#738477;font-size:11px;margin-bottom:5px}.history-metrics strong{font-size:16px;font-variant-numeric:tabular-nums}.history-body h3{font-size:14px;margin:18px 0 6px}.history-player{border-bottom:1px solid #edf1eb;padding:8px 0}.history-player>summary{list-style:none;cursor:pointer}.history-person{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800}.history-sub{color:#748379;font-size:12px;margin-top:3px}.history-events{padding:4px 0 7px 12px}.history-foot{margin-top:13px}.history-foot .btn{font-size:13px}
    @media(max-width:480px){.summary{gap:7px}.stat{padding:11px}.stat strong{font-size:19px}.player-values strong{font-size:15px}.addgrid{grid-template-columns:1fr 110px}.addgrid button{grid-column:1/-1}.hero h1{font-size:26px}}

<body>
  <header class="hero"><div class="hero-inner"><div class="eyebrow">POKER LEDGER</div><h1>牌局账本</h1><p>买入随手记，离场即结算。数据只保存在当前设备。</p><span id="offlineState" class="offline-state">正在准备离线使用…</span></div></header>
  <main class="wrap">
    <div id="storageNotice" class="notice" hidden>当前浏览器无法保存本地数据。关闭页面后记录可能丢失，请先导出备份。</div>
    <section class="panel">
      <div class="sessionbar"><div class="label">当前牌局</div><select id="sessionSelect" aria-label="选择牌局"></select><button class="btn outline" id="newSession">＋ 新开一局</button><a class="btn outline jump" href="#history">查看历史</a></div>
      <div class="modebar"><div class="label">本场买入模式</div><div class="segment"><button type="button" data-mode="hand">整手买入</button><button type="button" data-mode="amount">任意金额</button></div><div class="unitline" id="unitLine"><label for="unitAmount">每手金额 ¥</label><input id="unitAmount" type="number" inputmode="decimal" min="0.01" step="0.01" value="300"></div><p class="hint" id="modeHint"></p></div>
    </section>
    <section class="panel">
      <form id="addForm" class="addgrid"><input id="playerName" placeholder="玩家昵称" aria-label="玩家昵称" maxlength="24" required autocomplete="off"><input id="initialBuy" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="首次买入手数" required><button class="btn primary" type="submit">加入牌局</button></form><p id="addHint" class="hint"></p>
    </section>
    <section class="panel">
      <div class="overviewhead"><h2>牌局总览</h2><span id="gameStatus" class="badge">进行中</span></div><p id="gameMeta" class="game-meta"></p>
      <div class="summary"><div class="stat"><span>全桌累计买入</span><strong id="totalBuy">¥0</strong></div><div class="stat"><span>已兑出</span><strong id="totalCash">¥0</strong></div><div class="stat"><span id="thirdLabel">在场玩家</span><strong id="thirdValue">0 人</strong></div></div>
      <div class="overviewfoot"><p class="hint" id="summaryHint"></p><button class="btn primary" id="settleGame">结算整场牌局</button></div><div id="settlementResults" class="results" hidden></div>
    </section>
    <div class="sectionhead"><h2>玩家列表</h2><span class="count" id="playerCount"></span></div>
    <div id="players"></div>
    <div class="sectionhead" id="history"><h2>历史牌局</h2><span class="count" id="historyCount"></span></div>
    <input id="historySearch" class="history-search" type="search" placeholder="搜索日期或玩家昵称" aria-label="搜索历史牌局">
    <div id="historyList"></div>
    <div class="sectionhead"><h2>本地数据</h2></div>
    <section class="panel tools"><button class="btn outline" id="undo">↶ 撤销上一步</button><button class="btn outline" id="export">导出备份</button><button class="btn outline" id="import">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></section>
    <p class="hint">各手机的记录相互独立，不会自动同步。清理浏览器数据或删除桌面应用可能丢失记录，建议每场结束导出备份。旧版 Demo 的记录可先导出，再在这里导入。</p>
  </main>
  <dialog id="amountDialog"><form id="amountForm" class="dialog-body"><h3 id="dialogTitle"></h3><p id="dialogHelp"></p><input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" required aria-label="金额"><div class="dialog-actions"><button id="cancelAmount" class="btn outline" type="button">取消</button><button class="btn primary" type="submit">确认</button></div></form></dialog>
  <dialog id="settlementDialog"><form id="settlementForm" class="dialog-body"><h3>结算整场牌局</h3><p>填写仍在场玩家本次的兑出金额；输光填 0。已经离场的玩家无需重复填写。</p><div id="settlementFields"></div><div id="settlementPreview" class="settle-preview"></div><div class="dialog-actions"><button id="cancelSettlement" class="btn outline" type="button">取消</button><button class="btn primary" type="submit">确认整场结算</button></div></form></dialog>
  <script>
  (() => {
    'use strict';
    const KEY = 'poker-ledger-demo-v1';
    const $ = id => document.getElementById(id);
    const uid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(36).slice(2);
    const now = () => new Date().toISOString();
    const dateLabel = timestamp => new Date(timestamp).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const fullDateLabel = timestamp => new Date(timestamp).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const money = cents => '¥' + (cents / 100).toLocaleString('zh-CN',{minimumFractionDigits:cents % 100 ? 2 : 0,maximumFractionDigits:2});
    const signed = cents => (cents > 0 ? '+' : cents < 0 ? '−' : '') + money(Math.abs(cents));
    const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const amountCents = value => {
      const str = String(value).trim();
      if (!/^(?:\d{1,9})(?:\.\d{1,2})?$/.test(str)) return null;
      const [yuan, fen = ''] = str.split('.');
      return Number(yuan) * 100 + Number(fen.padEnd(2,'0'));
    };
    const handCount = value => /^(?:[1-9]\d{0,5})$/.test(String(value).trim()) ? Number(value) : null;
    const newGame = () => ({id:uid(),createdAt:now(),mode:'hand',unitCents:30000,settledAt:null,players:[]});
    let state = {version:2,sessions:[newGame()],activeId:null,undo:[]};
    state.activeId = state.sessions[0].id;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (validState(saved)) state = normalize(saved);
    } catch (_) { $('storageNotice').hidden = false; }
    function validState(v) {
      return v && [1,2].includes(v.version) && Array.isArray(v.sessions) && v.sessions.length > 0 && typeof v.activeId === 'string' &&
        v.sessions.some(s => s.id === v.activeId) && v.sessions.every(s => typeof s.id === 'string' && typeof s.createdAt === 'string' && Array.isArray(s.players) &&
          s.players.every(p => typeof p.id === 'string' && typeof p.name === 'string' && typeof p.active === 'boolean' && (p.stack === null || Number.isSafeInteger(p.stack) && p.stack >= 0) &&
            Array.isArray(p.events) && p.events.every(e => typeof e.id === 'string' && ['buy','cash','stack'].includes(e.type) && Number.isSafeInteger(e.amount) && e.amount >= 0 && typeof e.at === 'string' && (e.hands === undefined || Number.isSafeInteger(e.hands) && e.hands > 0))));
    }
    function normalize(v) {
      return {version:2,activeId:v.activeId,undo:Array.isArray(v.undo)?v.undo:[],sessions:v.sessions.map(s => ({...s,
        mode:s.mode==='hand'?'hand':'amount',unitCents:Number.isSafeInteger(s.unitCents)&&s.unitCents>0?s.unitCents:30000,
        settledAt:typeof s.settledAt==='string'?s.settledAt:null}))};
    }
    function save() {
      try { localStorage.setItem(KEY,JSON.stringify(state)); $('storageNotice').hidden = true; }
      catch (_) { $('storageNotice').hidden = false; }
    }
    function mutate(fn) {
      const before = JSON.stringify({...state,undo:[]});
      fn();
      state.undo = (state.undo || []).concat(before).slice(-20);
      save(); render();
    }
    const game = () => state.sessions.find(s => s.id === state.activeId);
    const player = id => game().players.find(p => p.id === id);
    const totals = p => p.events.reduce((a,e) => {if(e.type === 'buy'){a.buy += e.amount;a.hands += e.hands||0;} if(e.type === 'cash') a.cash += e.amount; return a;},{buy:0,cash:0,hands:0});
    function event(p,type,amount,hands) { p.events.push({id:uid(),type,amount,at:now(),...(hands?{hands}:{})}); }
    const buyValue = raw => game().mode==='hand' ? (()=>{const hands=handCount(raw);return hands===null||!Number.isSafeInteger(hands*game().unitCents)?null:{amount:hands*game().unitCents,hands};})() : (()=>{const amount=amountCents(raw);return amount===null||amount<=0?null:{amount};})();
    function render() {
      const g=game(),hand=g.mode==='hand',closed=!!g.settledAt;
      $('sessionSelect').innerHTML = state.sessions.slice().reverse().map(s => '<option value="'+escapeHtml(s.id)+'">'+escapeHtml(dateLabel(s.createdAt))+' · '+s.players.length+' 人'+(s.settledAt?' · 已结算':'')+'</option>').join('');
      $('sessionSelect').value = state.activeId;
      document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===g.mode);b.disabled=closed;});
      $('unitLine').hidden=!hand;$('unitAmount').value=(g.unitCents/100).toString();$('unitAmount').disabled=closed;
      $('modeHint').textContent=closed?'本场已结算，重新打开后可继续记账。':hand?'买入按整手计算；切换模式或调整每手金额只影响后续买入。':'买入可填写任意金额；切换模式只影响后续买入。';
      $('initialBuy').value=hand?'1':'300';$('initialBuy').step=hand?'1':'0.01';$('initialBuy').min=hand?'1':'0.01';
      $('initialBuy').inputMode=hand?'numeric':'decimal';$('initialBuy').setAttribute('aria-label',hand?'首次买入手数':'首次买入金额');
      $('initialBuy').placeholder=hand?'买入手数':'买入金额';$('addHint').textContent=hand?'输入手数，例如 2 手 = '+money(g.unitCents*2)+'。':'输入首次买入金额，例如 300 元。';
      [...$('addForm').elements].forEach(el=>el.disabled=closed);
      $('gameStatus').textContent=closed?'已结算':'进行中';$('gameStatus').className='badge'+(closed?' left':'');
      $('gameMeta').textContent='开局 '+dateLabel(g.createdAt)+' · 共 '+g.players.length+' 人 · '+(hand?'整手 '+money(g.unitCents)+'/手':'任意金额');
      $('settleGame').textContent=closed?'重新打开牌局':'结算整场牌局';$('settleGame').disabled=!closed&&g.players.length===0;
      const ps = g.players;
      const sum = ps.reduce((a,p) => {const t=totals(p);a.buy+=t.buy;a.cash+=t.cash;a.active+=p.active?1:0;return a;},{buy:0,cash:0,active:0});
      $('totalBuy').textContent=money(sum.buy); $('totalCash').textContent=money(sum.cash);
      $('thirdLabel').textContent=closed?'全桌结算差额':'在场玩家';
      $('thirdValue').textContent=closed?signed(sum.cash-sum.buy):sum.active+' 人';
      $('thirdValue').className=closed?(sum.cash-sum.buy===0?'green':'red'):'';
      $('summaryHint').textContent=closed?'已结算 '+dateLabel(g.settledAt)+'。无抽水或其他费用时，差额应为 ¥0。':sum.active?'填写仍在场玩家的兑出金额，即可结算整场牌局。':'全部玩家已离场，可确认整场结算。';
      $('settlementResults').hidden=!closed;
      $('settlementResults').innerHTML=closed?'<h3>全桌输赢</h3>'+ps.map(p=>{const t=totals(p),v=t.cash-t.buy;return '<div class="result-row"><span>'+escapeHtml(p.name)+'</span><strong class="'+(v>0?'profit pos':v<0?'profit neg':'')+'">'+signed(v)+'</strong></div>';}).join(''):'';
      $('playerCount').textContent=ps.length+' 人'; $('undo').disabled=!(state.undo||[]).length;
      $('players').innerHTML=ps.length ? ps.map(p => {
        const t=totals(p), profit=p.active?(p.stack===null?null:t.cash+p.stack-t.buy):t.cash-t.buy;
        const label=profit===null?'待录筹码':signed(profit);
        const cls=profit===null?'muted':profit>0?'profit pos':profit<0?'profit neg':'';
        const log=p.events.slice().reverse().map(e => '<div class="log-row"><span>'+escapeHtml(e.type==='buy'?(e.hands?'买入 '+e.hands+' 手':'买入'):e.type==='cash'?'兑出':'筹码快照')+' <small>'+escapeHtml(dateLabel(e.at))+'</small></span><b>'+money(e.amount)+'</b></div>').join('');
        return '<article class="panel player" data-id="'+escapeHtml(p.id)+'"><div class="player-head"><div class="player-name">'+escapeHtml(p.name)+'</div><span class="badge '+(p.active?'':'left')+'">'+(p.active?'游戏中':'已离场')+'</span></div>'+ (p.active && p.stack!==null?'<p class="tiny">当前筹码 '+money(p.stack)+'（补买后需重新录入）</p>':'')+
          '<div class="player-values"><div><span>累计买入'+(t.hands?' · '+t.hands+' 手':'')+'</span><strong>'+money(t.buy)+'</strong></div><div><span>累计兑出</span><strong>'+money(t.cash)+'</strong></div><div><span>'+(p.active?'暂时输赢':'最终输赢')+'</span><strong class="'+cls+'">'+label+'</strong></div></div>'+ 
          '<div class="player-actions">'+(closed?'':p.active?(hand?'<button class="btn" data-action="hand1">＋1 手</button><button class="btn" data-action="hand2">＋2 手</button><button class="btn" data-action="hand3">＋3 手</button>':'<button class="btn" data-action="buy100">＋100</button><button class="btn" data-action="buy300">＋300</button>')+'<button class="btn outline" data-action="buy">'+(hand?'其他手数':'补买')+'</button><button class="btn outline" data-action="stack">录筹码</button><button class="btn warn" data-action="leave">离场结算</button>':'<button class="btn" data-action="rejoin">再次入场</button>')+'<button class="btn outline" data-action="log">流水</button></div><div class="log" hidden>'+log+'</div></article>';
      }).join(''):'<div class="panel empty">还没有玩家。输入昵称和首次买入，开始记录吧。</div>';
      renderHistory();
    }
    function renderHistory(){
      const list=$('historyList'),openIds=new Set([...list.querySelectorAll('.history-card[open]')].map(d=>d.dataset.historyId));
      const query=$('historySearch').value.trim().toLocaleLowerCase();
      const sessions=state.sessions.slice().reverse().filter(s=>!query||[fullDateLabel(s.createdAt),s.createdAt,s.settledAt?fullDateLabel(s.settledAt):'',...s.players.map(p=>p.name)].some(v=>v.toLocaleLowerCase().includes(query)));
      $('historyCount').textContent=sessions.length+' / '+state.sessions.length+' 场';
      list.innerHTML=sessions.length?sessions.map(s=>{
        const t=s.players.reduce((a,p)=>{const v=totals(p);a.buy+=v.buy;a.cash+=v.cash;a.active+=p.active?1:0;return a;},{buy:0,cash:0,active:0});
        const closed=!!s.settledAt,status=closed?'已结算':t.active?'进行中':'待确认结算';
        const persons=s.players.length?s.players.map(p=>{
          const v=totals(p),profit=closed||!p.active?v.cash-v.buy:null;
          const events=p.events.filter(e=>e.type==='buy'||e.type==='cash').map(e=>'<div class="log-row"><span>'+(e.type==='buy'?'买入'+(e.hands?' '+e.hands+' 手':''):'兑出')+' <small>'+escapeHtml(dateLabel(e.at))+'</small></span><b>'+money(e.amount)+'</b></div>').join('');
          return '<details class="history-player"><summary><div class="history-person"><span>'+escapeHtml(p.name)+'</span><span class="'+(profit===null?'':profit>0?'profit pos':profit<0?'profit neg':'')+'">'+(profit===null?'待结算':signed(profit))+'</span></div><div class="history-sub">买入 '+money(v.buy)+(v.hands?' · '+v.hands+' 手':'')+'　兑出 '+money(v.cash)+' · 点击看逐笔记录</div></summary><div class="history-events">'+events+'</div></details>';
        }).join(''):'<p class="hint">本场暂无玩家记录。</p>';
        return '<details class="panel history-card" data-history-id="'+escapeHtml(s.id)+'"'+(openIds.has(s.id)?' open':'')+'><summary><div class="history-top"><strong>'+escapeHtml(fullDateLabel(s.createdAt))+(s.id===state.activeId?' · 当前':'')+'</strong><span class="badge '+(closed?'left':'')+'">'+status+'</span></div><div class="history-line">'+s.players.length+' 人 · 买入 '+money(t.buy)+' · '+(closed?'兑出 '+money(t.cash)+' · 差额 '+signed(t.cash-t.buy):'已兑出 '+money(t.cash))+'</div></summary><div class="history-body"><div class="history-metrics"><div><span>全桌买入</span><strong>'+money(t.buy)+'</strong></div><div><span>最终兑出'+(closed?'':'（已记录）')+'</span><strong>'+money(t.cash)+'</strong></div><div><span>玩家人数</span><strong>'+s.players.length+' 人</strong></div><div><span>'+(closed?'结算差额':'在场人数')+'</span><strong>'+ (closed?signed(t.cash-t.buy):t.active+' 人')+'</strong></div></div>'+(closed?'<p class="hint">结算时间 '+escapeHtml(fullDateLabel(s.settledAt))+'。无抽水或其他费用时，差额应为 ¥0。</p>':'<p class="hint">本场尚未整场结算；在场玩家的最终输赢暂不显示。</p>')+'<h3>玩家买入与输赢</h3>'+persons+'<div class="history-foot"><button class="btn outline" data-open-session="'+escapeHtml(s.id)+'">打开此局</button></div></div></details>';
      }).join(''):'<div class="panel empty">没有匹配的牌局。</div>';
    }
    $('historySearch').addEventListener('input',renderHistory);
    $('historyList').addEventListener('click',e=>{
      const button=e.target.closest('[data-open-session]');if(!button)return;
      state.activeId=button.dataset.openSession;save();render();window.scrollTo({top:0,behavior:'smooth'});
    });
    $('addForm').addEventListener('submit',e => {
      e.preventDefault(); if(game().settledAt)return;const name=$('playerName').value.trim(),buy=buyValue($('initialBuy').value);
      if(!name || !buy) return alert(game().mode==='hand'?'请输入昵称和正整数手数。':'请输入昵称和大于 0 的买入金额。');
      if(game().players.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase())) return alert('本场已有同名玩家，请换一个昵称。');
      mutate(()=>{const p={id:uid(),name,active:true,stack:null,events:[]};event(p,'buy',buy.amount,buy.hands);game().players.push(p);});
      $('playerName').value='';$('playerName').focus();
    });
    $('newSession').addEventListener('click',()=>{mutate(()=>{const s=newGame();state.sessions.push(s);state.activeId=s.id;});});
    $('sessionSelect').addEventListener('change',e=>{state.activeId=e.target.value;save();render();});
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{if(game().settledAt||game().mode===button.dataset.mode)return;mutate(()=>{game().mode=button.dataset.mode;});}));
    $('unitAmount').addEventListener('change',()=>{const value=amountCents($('unitAmount').value);if(value===null||value<=0){alert('每手金额必须大于 0。');render();return;}if(!game().settledAt&&game().unitCents!==value)mutate(()=>{game().unitCents=value;});});
    let dialogResolve,dialogKind='money';
    function askAmount(title,help,defaultAmount='',kind='money') {
      dialogKind=kind;$('amountInput').min=kind==='hands'?'1':'0';$('amountInput').step=kind==='hands'?'1':'0.01';$('amountInput').inputMode=kind==='hands'?'numeric':'decimal';
      $('dialogTitle').textContent=title;$('dialogHelp').textContent=help;$('amountInput').value=defaultAmount;
      $('amountDialog').showModal();setTimeout(()=>$('amountInput').focus(),30);
      return new Promise(resolve=>{dialogResolve=resolve;});
    }
    function closeDialog(value) { $('amountDialog').close();const done=dialogResolve;dialogResolve=null;if(done)done(value); }
    $('cancelAmount').addEventListener('click',()=>closeDialog(null));
    $('amountDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog(null);});
    $('amountForm').addEventListener('submit',e=>{e.preventDefault();const value=dialogKind==='hands'?handCount($('amountInput').value):amountCents($('amountInput').value);if(value===null)return alert(dialogKind==='hands'?'请输入正整数手数。':'请输入有效金额，最多两位小数。');closeDialog(value);});
    $('players').addEventListener('click',async e=>{
      const button=e.target.closest('button[data-action]');if(!button)return;
      const card=button.closest('.player'),id=card.dataset.id,action=button.dataset.action,p=player(id);
      if(!p)return;
      if(action==='log'){const log=card.querySelector('.log');log.hidden=!log.hidden;return;}
      if(game().settledAt)return;
      if(['hand1','hand2','hand3','buy100','buy300'].includes(action)){
        const hands=action.startsWith('hand')?Number(action.slice(-1)):undefined;
        mutate(()=>{event(player(id),'buy',hands?hands*game().unitCents:action==='buy100'?10000:30000,hands);player(id).stack=null;});return;
      }
      const hand=game().mode==='hand';
      const config={buy:hand?['补买 · '+p.name,'输入本次新增手数，每手 '+money(game().unitCents)+'。','1','hands']:['补买 · '+p.name,'输入本次新增买入金额，不是累计金额。','300'],stack:['录入当前筹码 · '+p.name,'按现金价值输入当前桌上筹码，用于计算暂时输赢。',''],leave:['离场结算 · '+p.name,'输入本次实际兑出金额；输光了填 0。','0'],rejoin:hand?['再次入场 · '+p.name,'输入这次重新入场的买入手数。','1','hands']:['再次入场 · '+p.name,'输入这次重新入场的买入金额。','300']}[action];
      if(!config)return;const amount=await askAmount(...config);
      if(amount===null)return;
      if((action==='buy'||action==='rejoin')&&amount<=0)return alert('买入金额必须大于 0。');
      const hands=hand&&['buy','rejoin'].includes(action)?amount:undefined;
      const buyAmount=hands?hands*game().unitCents:amount;
      if(!Number.isSafeInteger(buyAmount))return alert('金额过大，请减少手数。');
      mutate(()=>{const q=player(id);if(action==='buy'){event(q,'buy',buyAmount,hands);q.stack=null;}if(action==='stack'){event(q,'stack',amount);q.stack=amount;}if(action==='leave'){event(q,'cash',amount);q.stack=null;q.active=false;}if(action==='rejoin'){event(q,'buy',buyAmount,hands);q.active=true;q.stack=null;}});
    });
    $('settleGame').addEventListener('click',()=>{
      if(game().settledAt){mutate(()=>{game().settledAt=null;});return;}
      const pending=game().players.filter(p=>p.active);
      $('settlementFields').innerHTML=pending.length?pending.map(p=>{const t=totals(p);return '<div class="settle-row"><label for="settle-'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'<small>累计买入 '+money(t.buy)+'</small></label><input id="settle-'+escapeHtml(p.id)+'" data-player-id="'+escapeHtml(p.id)+'" type="number" inputmode="decimal" min="0" step="0.01" placeholder="兑出金额" required></div>';}).join(''):'<p>所有玩家已单独离场，可直接确认本场结算。</p>';
      updateSettlementPreview();$('settlementDialog').showModal();
    });
    function updateSettlementPreview(){
      const ps=game().players,tot=ps.reduce((a,p)=>{const t=totals(p);a.buy+=t.buy;a.cash+=t.cash;return a;},{buy:0,cash:0});
      const inputs=[...$('settlementFields').querySelectorAll('input')],values=inputs.map(input=>amountCents(input.value));
      const complete=values.every(v=>v!==null),future=values.filter(v=>v!==null).reduce((a,v)=>a+v,tot.cash);
      $('settlementPreview').innerHTML='全桌买入 '+money(tot.buy)+' · 结算后兑出 '+(complete?money(future):'待填写')+'<br>结算差额 <strong>'+(complete?signed(future-tot.buy):'待填写')+'</strong><br><small>无抽水或其他费用时，差额应为 ¥0。</small>';
    }
    $('settlementFields').addEventListener('input',updateSettlementPreview);
    $('cancelSettlement').addEventListener('click',()=>$('settlementDialog').close());
    $('settlementForm').addEventListener('submit',e=>{
      e.preventDefault();const entries=[...$('settlementFields').querySelectorAll('input')].map(input=>({id:input.dataset.playerId,amount:amountCents(input.value)}));
      if(entries.some(x=>x.amount===null))return alert('请填全所有在场玩家的兑出金额；输光填 0。');
      mutate(()=>{entries.forEach(({id,amount})=>{const p=player(id);event(p,'cash',amount);p.stack=null;p.active=false;});game().settledAt=now();});
      $('settlementDialog').close();
    });
    $('undo').addEventListener('click',()=>{if(!state.undo?.length)return;const previous=normalize(JSON.parse(state.undo.pop())),remaining=state.undo;state={...previous,undo:remaining};save();render();});
    $('export').addEventListener('click',()=>{
      const blob=new Blob([JSON.stringify({version:2,sessions:state.sessions,activeId:state.activeId},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='牌局账本备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
    $('import').addEventListener('click',()=>$('importFile').click());
    $('importFile').addEventListener('change',async e=>{
      const file=e.target.files[0];e.target.value='';if(!file)return;
      if(file.size>5_000_000)return alert('文件超过 5 MB。');
      try {const data=JSON.parse(await file.text());if(!validState(data))throw Error('格式不符');
        if(!confirm('导入会覆盖当前所有牌局记录。建议先导出当前备份。确定继续吗？'))return;
        state=normalize(data);state.undo=[];save();render();
      }catch(_){alert('无法导入：这不是有效的牌局账本备份。');}
    });
    save();render();
    const modelContext=document.modelContext;
    if(modelContext?.registerTool){
      const register=tool=>{try{Promise.resolve(modelContext.registerTool(tool)).catch(()=>{});}catch(_){}};
      register({name:'read_poker_game',title:'查看当前牌局',description:'读取当前牌局的买入、兑出与玩家状态。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({sessionId:game().id,mode:game().mode,unitAmount:game().unitCents/100,settled:!!game().settledAt,players:game().players.map(p=>({id:p.id,name:p.name,active:p.active,buyin:totals(p).buy/100,cashout:totals(p).cash/100}))})});
      register({name:'record_poker_buyin',title:'记录玩家补买',description:'为当前牌局中一位在场玩家记录新增买入。整手模式的 quantity 是手数，任意金额模式是元数。',inputSchema:{type:'object',properties:{playerId:{type:'string'},quantity:{type:'number',exclusiveMinimum:0}},required:['playerId','quantity'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(game().settledAt)throw Error('牌局已结算');const p=player(input?.playerId),buy=buyValue(input?.quantity);if(!p?.active||!buy)throw Error('玩家或买入数量无效');mutate(()=>{event(p,'buy',buy.amount,buy.hands);p.stack=null;});return {playerId:p.id,totalBuyin:totals(p).buy/100};}});
    }
    if ('serviceWorker' in navigator && location.protocol==='https:') {
      window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offlineState').textContent='已可离线使用';}).catch(()=>{$('offlineState').textContent='离线缓存未就绪，请联网刷新';});});
    } else $('offlineState').textContent='当前环境未启用离线缓存';
  })();
  </script>
</body>
</html>
